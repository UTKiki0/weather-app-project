<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Wear</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="main-view">
    <!-- Top bar: location search, device location, info -->
    <header class="top-bar">
      <form class="search" role="search" id="search-form">
        <label class="visually-hidden" for="location-input">Search US city or zip code</label>
        <input id="location-input" type="search" placeholder="City or zip" autocomplete="off">
        <button type="submit" class="icon-btn" aria-label="Search location">
          <img src="assets/ui/search.svg" alt="">
        </button>
      </form>
      <button type="button" class="icon-btn" id="device-location-btn" aria-label="Use my device location">
        <img src="assets/ui/map-pin.svg" alt="">
      </button>
      <button type="button" class="icon-btn" id="info-btn" aria-label="About this app">
        <img src="assets/ui/info.svg" alt="">
      </button>

      <!-- Search feedback: status message and the pick-a-result list for ambiguous matches (R2a) -->
      <p class="search-status" id="search-status" role="status" hidden></p>
      <ul class="results" id="results" aria-label="Matching locations" hidden></ul>
    </header>

    <!-- Character stage: background, temperature, character, customize. Filled by render.js
         from the one recommendation state. -->
    <section class="stage" id="stage" aria-label="Outfit recommendation">
      <div class="stage-header">
        <p class="place" id="place"></p>
        <p class="when" id="when"></p>
        <p class="temp" id="temp"></p>
        <p class="condition" id="condition" role="status"></p>
      </div>

      <div class="character" id="character"></div>

      <button type="button" class="icon-btn customize-btn" id="customize-btn" aria-label="Change outfit style" disabled>
        <img src="assets/ui/shirt.svg" alt="">
      </button>
    </section>

    <!-- Info pill: overlays the stage on phone, sits in the right column on laptop.
         Rain/wind labels and reminder wording are visible on laptop; on phone, reminder wording
         shows when its icon is tapped. Always available to screen readers. -->
    <ul class="pill" id="pill" aria-label="Weather details" hidden></ul>

    <!-- 7-day strip: today + 6 days, doubles as the date picker -->
    <nav class="day-strip" id="day-strip" aria-labelledby="day-strip-title">
      <h2 class="strip-title" id="day-strip-title">Upcoming days</h2>
      <div class="days" id="days"></div>
    </nav>
  </main>

  <!-- Customization picker: the active category's outfit variations (R9, R10) -->
  <dialog class="outfit-dialog" id="outfit-dialog" aria-labelledby="outfit-dialog-title">
    <h2 id="outfit-dialog-title"></h2>
    <div class="outfit-options" id="outfit-options"></div>
    <button type="button" class="dialog-close" id="outfit-close">Close</button>
  </dialog>

  <script type="module" src="main.js"></script>
</body>
</html>
